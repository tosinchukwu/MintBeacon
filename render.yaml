services:
  - type: web
    name: mintbeacon-mcp
    runtime: python
    plan: free
    region: ohio
    rootDir: mcp
    buildCommand: python -m py_compile server.py http_server.py test_transports.py && python -m unittest test_transports
    startCommand: python http_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MINTBEACON_ADDRESS
        value: 0x29f9AaBF15f681011334Ba131E6CBb884b39AF2B
      - key: MCP_ALLOWED_ORIGINS
        value: https://mintbeacon.vercel.app
      - key: MCP_ALLOWED_HOSTS
        value: mintbeacon-mcp.onrender.com
      - key: MCP_RATE_LIMIT_PER_MINUTE
        value: 30
      - key: MCP_MAX_BODY_BYTES
        value: 65536
